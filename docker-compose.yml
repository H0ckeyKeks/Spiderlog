services:
  php:
    build:
      context: ./docker/php
    volumes:
      - ./:/var/www/html
    depends_on:
      - database
    networks:
      - spiderlog

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - spiderlog

  database:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: spiderlog
      MYSQL_USER: spiderlog
      MYSQL_PASSWORD: spiderlog
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - spiderlog

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - database
    networks:
      - spiderlog

volumes:
  db_data:

networks:
  spiderlog: